<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Ube & Sand Halo-Halo Shop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍧</text></svg>" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1>Reset <span>Password</span></h1>
      <p>Ube &amp; Sand Halo-Halo Shop</p>
    </div>

    <p class="auth-title" style="font-size:0.875rem;color:var(--gray-500);font-weight:400;text-align:center;margin-bottom:22px;">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <div class="alert alert-danger d-none" id="errorAlert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="errorMsg"></span>
    </div>

    <div class="alert alert-success d-none" id="successAlert">
      <i class="fa-solid fa-circle-check"></i>
      <span>Reset link sent! Check your email inbox.</span>
    </div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
        <i class="fa-solid fa-paper-plane"></i>
        Send Reset Link
      </button>
    </form>

    <a href="index.html" class="forgot-link" style="margin-top:20px;">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const resetForm = document.getElementById('resetForm');
    const resetBtn = document.getElementById('resetBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMsg = document.getElementById('errorMsg');
    const successAlert = document.getElementById('successAlert');

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { showError('Please enter your email address.'); return; }

      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Sending...';
      errorAlert.classList.add('d-none');

      try {
        await sendPasswordResetEmail(auth, email);
        successAlert.classList.remove('d-none');
        resetForm.reset();
      } catch (error) {
        let msg = 'Failed to send reset email.';
        if (error.code === 'auth/user-not-found') msg = 'No account found with that email.';
        showError(msg);
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorAlert.classList.remove('d-none');
    }
  </script>
</body>
</html>
