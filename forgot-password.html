<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Ube & Sand Halo-Halo Shop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fa-solid fa-key"></i></div>
      <h1>Reset <span>Password</span></h1>
      <p>Ube &amp; Sand Halo-Halo Shop</p>
    </div>
    <p style="font-size:0.875rem;color:var(--gray-500);text-align:center;margin-bottom:22px;">
      Enter your email and we'll send you a reset link.
    </p>

    <div class="alert alert-danger d-none" id="errAlert">
      <i class="fa-solid fa-circle-exclamation"></i><span id="errMsg"></span>
    </div>
    <div class="alert alert-success d-none" id="okAlert">
      <i class="fa-solid fa-circle-check"></i><span>Reset link sent! Check your email.</span>
    </div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <a href="index.html" class="forgot-link" style="margin-top:20px;">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email  = document.getElementById('email').value.trim();
      const btn    = document.getElementById('resetBtn');
      const errAlert = document.getElementById('errAlert');
      const okAlert  = document.getElementById('okAlert');
      if (!email) { showErr('Please enter your email.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Sending...';
      errAlert.classList.add('d-none');

      try {
        await sendPasswordResetEmail(auth, email);
        okAlert.classList.remove('d-none');
        document.getElementById('resetForm').reset();
      } catch (err) {
        showErr(err.code === 'auth/user-not-found' ? 'No account with that email.' : 'Failed to send email.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';
      }

      function showErr(msg) {
        document.getElementById('errMsg').textContent = msg;
        errAlert.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
