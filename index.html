<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Ube & Sand Halo-Halo Shop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍧</text></svg>" />
</head>
<body class="auth-page">

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span>Loading...</span>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <i class="fa-solid fa-bowl-food"></i>
      </div>
      <h1>Ube <span>&</span> Sand</h1>
      <p>Halo-Halo Shop</p>
    </div>

    <p class="auth-title">Admin Login</p>

    <!-- Alert -->
    <div class="alert alert-danger d-none" id="loginAlert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="loginAlertMsg">Invalid credentials. Please try again.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Username or Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <i class="fa-solid fa-lock" style="left:14px;"></i>
          <i class="fa-solid fa-eye toggle-password" id="togglePwd" title="Show/Hide password"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i>
        Login
      </button>
    </form>

    <a href="forgot-password.html" class="forgot-link">
      <i class="fa-solid fa-key"></i> Forgot Password?
    </a>

    <div class="auth-footer">
      <p>🍧 Ube &amp; Sand Halo-Halo Shop Inventory System</p>
      <p style="margin-top:4px;">Secured with Firebase Authentication</p>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loadingOverlay = document.getElementById('loadingOverlay');
    const loginForm = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');
    const loginAlertMsg = document.getElementById('loginAlertMsg');
    const loginBtn = document.getElementById('loginBtn');
    const togglePwd = document.getElementById('togglePwd');
    const passwordInput = document.getElementById('password');

    // Check if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      } else {
        loadingOverlay.style.display = 'none';
      }
    });

    // Toggle password visibility
    togglePwd.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePwd.className = type === 'password'
        ? 'fa-solid fa-eye toggle-password'
        : 'fa-solid fa-eye-slash toggle-password';
    });

    // Login form submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Please fill in all fields.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Logging in...';
      loginAlert.classList.add('d-none');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
        let msg = 'Login failed. Please check your credentials.';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          msg = 'Invalid email or password. Please try again.';
        } else if (error.code === 'auth/too-many-requests') {
          msg = 'Too many failed attempts. Please try again later.';
        } else if (error.code === 'auth/network-request-failed') {
          msg = 'Network error. Please check your connection.';
        }
        showAlert(msg);
      }
    });

    function showAlert(msg) {
      loginAlertMsg.textContent = msg;
      loginAlert.classList.remove('d-none');
    }
  </script>
</body>
</html>
