<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Ube & Sand Halo-Halo Shop</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-page">

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div><span>Loading...</span>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fa-solid fa-bowl-food"></i></div>
      <h1>Ube <span>&</span> Sand</h1>
      <p>Halo-Halo Shop</p>
    </div>

    <p class="auth-title">Admin Login</p>

    <div class="alert alert-danger d-none" id="loginAlert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="loginAlertMsg">Invalid credentials.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required />
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
          <i class="fa-solid fa-lock" style="left:14px;pointer-events:none;"></i>
          <i class="fa-solid fa-eye toggle-password" id="togglePwd" style="cursor:pointer;"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

    <a href="forgot-password.html" class="forgot-link">
      <i class="fa-solid fa-key"></i> Forgot Password?
    </a>

    <div class="auth-footer">
      <p>🍧 Ube &amp; Sand Halo-Halo Shop Inventory System</p>
      <p style="margin-top:4px;font-size:0.7rem;">Secured with Firebase Authentication</p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const overlay      = document.getElementById('loadingOverlay');
    const loginForm    = document.getElementById('loginForm');
    const loginAlert   = document.getElementById('loginAlert');
    const loginAlertMsg= document.getElementById('loginAlertMsg');
    const loginBtn     = document.getElementById('loginBtn');
    const togglePwd    = document.getElementById('togglePwd');
    const pwdInput     = document.getElementById('password');

    // Already logged in → go to dashboard
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      } else {
        overlay.style.display = 'none';
      }
    });

    // Toggle password
    togglePwd.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      togglePwd.className = show
        ? 'fa-solid fa-eye-slash toggle-password'
        : 'fa-solid fa-eye toggle-password';
    });

    // Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = pwdInput.value;
      if (!email || !password) { showAlert('Please fill in all fields.'); return; }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span> Logging in...';
      loginAlert.classList.add('d-none');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
        let msg = 'Login failed. Check your credentials.';
        if (['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].includes(err.code))
          msg = 'Invalid email or password.';
        else if (err.code === 'auth/too-many-requests')
          msg = 'Too many attempts. Try again later.';
        else if (err.code === 'auth/network-request-failed')
          msg = 'Network error. Check your connection.';
        showAlert(msg);
      }
    });

    function showAlert(msg) {
      loginAlertMsg.textContent = msg;
      loginAlert.classList.remove('d-none');
    }
  </script>
</body>
</html>
